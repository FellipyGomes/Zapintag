<!DOCTYPE html>
<html lang="pt-BR">
<head>
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Contato Digital</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:#f5f5f5;
      color:#111;
      display:flex;
      justify-content:center;
      padding:24px 16px;
    }

    .page{
      width:100%;
      max-width:430px;
      min-height:calc(100vh - 48px);
      background:#fff;
      border:1px solid #e5e5e5;
      border-radius:24px;
      padding:34px 22px 24px;
      display:flex;
      flex-direction:column;
      box-shadow:0 8px 30px rgba(0,0,0,.06);
    }

    .brand{
      text-align:center;
      margin-bottom:28px;
    }

    .logo{
      width:76px;
      height:76px;
      border-radius:50%;
      object-fit:cover;
      display:block;
      margin:0 auto 16px;
      background:#111;
    }

    .brand h1{
      font-size:25px;
      line-height:1.15;
      font-weight:750;
      letter-spacing:-.5px;
    }

    .brand p{
      margin-top:9px;
      color:#666;
      font-size:15px;
      line-height:1.45;
    }

    .options{
      display:flex;
      flex-direction:column;
      gap:13px;
    }

    .option{
      display:none;
      align-items:center;
      gap:15px;
      width:100%;
      min-height:76px;
      padding:13px 16px;
      border:1px solid #e2e2e2;
      border-radius:17px;
      background:#fff;
      color:#111;
      text-decoration:none;
      transition:.15s;
    }

    .option:hover{
      transform:translateY(-1px);
      box-shadow:0 5px 18px rgba(0,0,0,.07);
    }

    .icon{
      width:48px;
      height:48px;
      flex:0 0 48px;
      border-radius:14px;
      background:#f2f2f2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
    }

    .text{
      flex:1;
    }

    .text strong{
      display:block;
      font-size:16px;
      margin-bottom:3px;
    }

    .text span{
      display:block;
      color:#777;
      font-size:13px;
    }

    .arrow{
      color:#aaa;
      font-size:22px;
    }

    .footer{
      margin-top:auto;
      padding-top:28px;
      text-align:center;
      color:#999;
      font-size:12px;
      line-height:1.6;
    }

    .nfc{
      margin-bottom:8px;
      display:inline-flex;
      align-items:center;
      gap:6px;
    }
  </style>
</head>

<body>

<main class="page">

  <header class="brand">
    <img id="logo" class="logo" alt="Logo">

    <h1 id="titulo">
      Como podemos ajudar?
    </h1>

    <p id="subtitle">
      Escolha uma opção para continuar.
    </p>
  </header>

  <section class="options">

    <a id="whatsapp" class="option" target="_blank">
      <div class="icon">
        <i class="fa-brands fa-whatsapp"></i>
      </div>

      <div class="text">
        <strong>WhatsApp</strong>
        <span>Entre em contato conosco</span>
      </div>

      <div class="arrow">›</div>
    </a>

    <a id="instagram" class="option" target="_blank">
      <div class="icon">
        <i class="fa-brands fa-instagram"></i>
      </div>

      <div class="text">
        <strong>Instagram</strong>
        <span>Acompanhe nossas novidades</span>
      </div>

      <div class="arrow">›</div>
    </a>

    <a id="google" class="option" target="_blank">
      <div class="icon">
        <i class="fa-brands fa-google"></i>
      </div>

      <div class="text">
        <strong>Avalie nossa empresa</strong>
        <span>Leva menos de 1 minuto</span>
      </div>

      <div class="arrow">›</div>
    </a>

  </section>

  <footer class="footer">
    <div class="nfc">
      <i class="fa-solid fa-signal"></i>
      Encoste o celular novamente para acessar
    </div>

    <div>
      Rápido, simples e seguro.
    </div>
  </footer>

</main>

<script>

const clientes = {

  "cli_a7x9k2": {
    nome: "EMPRESA",
    subtitle: "SLOGAN OU FRASE",
    logo: "logos/.png",
    whatsapp: "https://wa.me/",
    instagram: "https://www.instagram.com//",
    google: "https://search.google.com/local/writereview?placeid="
  },

  "cli_b4m8r1": {
    nome: "SkyFit Invernada",
    subtitle: "You Can Fly",
    logo: "logos/Designer.png",
    whatsapp: "https://wa.me/19999854416",
    instagram: "https://www.instagram.com/skyfitinvernada/",
    google: "https://search.google.com/local/writereview?placeid="
  },

  "cli_d2k6n8": {
    nome: "EMPRESA",
    subtitle: "SLOGAN OU FRASE",
    logo: "logos/.png",
    whatsapp: "https://wa.me/",
    instagram: "https://www.instagram.com//",
    google: "https://search.google.com/local/writereview?placeid="
  },

  "cli_e5q1v9": {
    nome: "EMPRESA",
    subtitle: "SLOGAN OU FRASE",
    logo: "logos/.png",
    whatsapp: "https://wa.me/",
    instagram: "https://www.instagram.com//",
    google: "https://search.google.com/local/writereview?placeid="
  },

  "cli_c9x3p7": {
    nome: "EMPRESA",
    subtitle: "SLOGAN OU FRASE",
    logo: "logos/.png",
    whatsapp: "https://wa.me/",
    instagram: "https://www.instagram.com//",
    google: "https://search.google.com/local/writereview?placeid="
  }

};

function configurarBotao(id, link){
  const botao = document.getElementById(id);
  if(!botao) return;

  if(link && link.trim() !== ""){
    botao.href = link;
    botao.style.display = "flex";
  }
}

const params = new URLSearchParams(window.location.search);

const clienteId =
  params.get("cliente") || "cli_a7x9k2";

const cliente = clientes[clienteId];

if(cliente){

  const tituloEl = document.getElementById("titulo");
  if(tituloEl) tituloEl.innerText = cliente.nome;

  const logoEl = document.getElementById("logo");
  if(logoEl && cliente.logo) logoEl.src = cliente.logo;

  const subtitleEl = document.getElementById("subtitle");
  if(subtitleEl) subtitleEl.innerText = cliente.subtitle || "";

  configurarBotao("whatsapp", cliente.whatsapp);
  configurarBotao("instagram", cliente.instagram);
  configurarBotao("google", cliente.google);

} else {

  document.querySelector(".page").innerHTML = `
    <div style="
      height:100%;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      padding:40px;
    ">
      <div style="font-size:56px;margin-bottom:20px;">
        ⚠️
      </div>

      <h1 style="margin-bottom:12px;">
        Cliente não encontrado
      </h1>

      <p style="
        color:#666;
        line-height:1.6;
      ">
        O identificador informado não existe ou não está ativo.
      </p>
    </div>
  `;

}

</script>

</body>
</html>
